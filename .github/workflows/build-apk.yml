name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install npm dependencies
      - name: Install dependencies
        run: npm install

      # Add Android platform
      - name: Add Android platform
        run: npx cap add android

      # Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # Add vibration and notification permissions
      - name: Add vibration and notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = '''<uses-permission android:name="android.permission.VIBRATE" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'''

          if "android.permission.VIBRATE" not in s:
              s = s.replace(
                  marker,
                  marker + "\n    " + permissions
              )

          p.write_text(s)
          PY

      # Build Debug APK
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mafaza-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
