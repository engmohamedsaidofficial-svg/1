          path = Path("www/index.html")
          source = path.read_text(encoding="utf-8")

          marker = "function schedulePrayerAlerts(times){"
          start = source.find(marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: schedulePrayerAlerts(times) not found"
              )

          brace_start = source.find("{", start)

          if brace_start == -1:
              raise SystemExit(
                  "ERROR: opening brace not found"
