name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      # Replace TypeScript Capacitor config with JSON config
      - name: Prepare Capacitor configuration
        run: |
          rm -f capacitor.config.ts

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.azkar.app",
            "appName": "أذكار",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon from resources/icon.png
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b3d24' --iconBackgroundColorDark '#0b3d24'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add vibration and notification permissions
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = '''    <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          '''

          if "android.permission.POST_NOTIFICATIONS" not in s:
              # يطابق أول وسم <manifest ...> مهما كانت صفاته أو تنسيقه، بدل نص ثابت هش
              match = re.search(r'<manifest\b[^>]*>', s)
              if not match:
                  print("ERROR: <manifest> tag not found in AndroidManifest.xml")
                  sys.exit(1)
              insert_at = match.end()
              s = s[:insert_at] + "\n" + permissions + s[insert_at:]
              p.write_text(s)
              print("Permissions inserted successfully.")
          else:
              print("Permissions already present, skipping.")

          # تحقق نهائي: افشل الـ build بوضوح لو الصلاحية المهمة مش موجودة فعليًا في الملف الناتج
          final = p.read_text()
          required = ["POST_NOTIFICATIONS", "SCHEDULE_EXACT_ALARM", "VIBRATE"]
          missing = [r for r in required if r not in final]
          if missing:
              print("ERROR: missing permissions after patch: " + ", ".join(missing))
              sys.exit(1)
          PY

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Azkar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
