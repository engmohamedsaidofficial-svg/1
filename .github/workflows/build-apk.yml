name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add vibration and notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms='''<uses-permission android:name="android.permission.VIBRATE" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'''
          if "android.permission.VIBRATE" not in s:
              s=s.replace(marker, marker+"\n    "+perms)
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mafaza-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
