name: Build Android APK
 
on:
  workflow_dispatch:
  push:
    branches: [ main ]
 
permissions:
  contents: read
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
 
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
 
      - name: Install dependencies
        run: npm install
 
      # إعداد Capacitor
      - name: Prepare Capacitor configuration
        run: |
          rm -f capacitor.config.ts
 
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.azkar.app",
            "appName": "أذكار",
            "webDir": "www",
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_azkar"
              }
            }
          }
          EOF
 
      # إضافة Android إذا لم يكن موجودًا
      - name: Add Android platform
        run: |
          if [ -d "android" ]; then
            echo "Android platform already exists. Skipping cap add android."
          else
            echo "Android platform not found. Adding it now..."
            npx cap add android
          fi
 
      # إنشاء أيقونة التطبيق
      - name: Generate app icon
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#0b3d24' \
            --iconBackgroundColorDark '#0b3d24'
 
      # =========================================================
      # تثبيت أيقونة الإشعارات
      # =========================================================
      - name: Install notification small icon
        run: |
          set -e
 
          if [ ! -f "www/ic_stat_azkar.png" ]; then
            echo "ERROR: www/ic_stat_azkar.png not found!"
            exit 1
          fi
 
          mkdir -p android/app/src/main/res/drawable
 
          cp "www/ic_stat_azkar.png" \
             "android/app/src/main/res/drawable/ic_stat_azkar.png"
 
          echo "Notification icon installed successfully:"
          ls -lh android/app/src/main/res/drawable/ic_stat_azkar.png
 
      # مزامنة Capacitor
      - name: Sync Capacitor
        run: npx cap sync android
 
      # =========================================================
      # نسخ نغمات الصلاة إلى Android
      # =========================================================
      - name: Install prayer notification sounds
        run: |
          set -e
 
          echo "Checking prayer audio files..."
 
          if [ ! -f "www/audio/before5.mp3" ]; then
            echo "ERROR: www/audio/before5.mp3 not found!"
            exit 1
          fi
 
          if [ ! -f "www/audio/azan.mp3" ]; then
            echo "ERROR: www/audio/azan.mp3 not found!"
            exit 1
          fi
 
          mkdir -p android/app/src/main/res/raw
 
          cp "www/audio/before5.mp3" \
             "android/app/src/main/res/raw/before5.mp3"
 
          cp "www/audio/azan.mp3" \
             "android/app/src/main/res/raw/azan.mp3"
 
          echo "Audio files copied successfully:"
          ls -lh android/app/src/main/res/raw/before5.mp3
          ls -lh android/app/src/main/res/raw/azan.mp3
 
      # =========================================================
      # إضافة الـ native plugin بتاع تشغيل الأذان كامل (Foreground Service + AlarmManager)
      # =========================================================
      - name: Install Adhan foreground-service plugin
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/azkar/app
          cp native-additions/java/com/azkar/app/AdhanForegroundService.kt android/app/src/main/java/com/azkar/app/
          cp native-additions/java/com/azkar/app/AdhanAlarmReceiver.kt android/app/src/main/java/com/azkar/app/
          cp native-additions/java/com/azkar/app/AdhanAlarmPlugin.kt android/app/src/main/java/com/azkar/app/
          echo "Adhan plugin sources copied."
 
      # =========================================================
      # تسجيل الـ plugin في MainActivity + إضافة الـ service/receiver في المانيفست
      # =========================================================
      - name: Register Adhan plugin
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
 
          # ---- 1) MainActivity: تسجيل الـ plugin ----
          main_activity = None
          for p in Path("android/app/src/main/java").rglob("MainActivity.java"):
              main_activity = p
              break
          if main_activity is None:
              for p in Path("android/app/src/main/java").rglob("MainActivity.kt"):
                  main_activity = p
                  break
          if main_activity is None:
              raise SystemExit("ERROR: MainActivity not found")
 
          s = main_activity.read_text()
          if "AdhanAlarmPlugin" not in s:
              if main_activity.suffix == ".java":
                  s = s.replace(
                      "public class MainActivity extends BridgeActivity {",
                      "public class MainActivity extends BridgeActivity {\n"
                      "  @Override\n"
                      "  public void onCreate(android.os.Bundle savedInstanceState) {\n"
                      "    registerPlugin(com.azkar.app.AdhanAlarmPlugin.class);\n"
                      "    super.onCreate(savedInstanceState);\n"
                      "  }\n"
                  )
              else:
                  s = s.replace(
                      "class MainActivity : BridgeActivity() {",
                      "class MainActivity : BridgeActivity() {\n"
                      "  override fun onCreate(savedInstanceState: android.os.Bundle?) {\n"
                      "    registerPlugin(com.azkar.app.AdhanAlarmPlugin::class.java)\n"
                      "    super.onCreate(savedInstanceState)\n"
                      "  }\n"
                  )
              main_activity.write_text(s)
              print("MainActivity patched.")
          else:
              print("MainActivity already patched.")
 
          # ---- 2) AndroidManifest: صلاحيات + service + receiver ----
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
 
          extra_permissions = """
              <uses-permission android:name=\"android.permission.WAKE_LOCK\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />
              <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />
          """
          if "FOREGROUND_SERVICE_MEDIA_PLAYBACK" not in m:
              match = re.search(r"<manifest\b[^>]*>", m)
              insert_at = match.end()
              m = m[:insert_at] + "\n" + extra_permissions + m[insert_at:]
              print("Extra permissions added.")
 
          if "AdhanForegroundService" not in m:
              component_block = """
              <service
                  android:name=\".AdhanForegroundService\"
                  android:foregroundServiceType=\"mediaPlayback\"
                  android:exported=\"false\" />
              <receiver
                  android:name=\".AdhanAlarmReceiver\"
                  android:exported=\"false\" />
          """
              m = m.replace("</application>", component_block + "    </application>")
              print("Service/receiver declared.")
 
          manifest.write_text(m)
          PY
 
      # =========================================================
      # صلاحيات الإشعارات والاهتزاز والمنبهات
      # =========================================================
      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path
 
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
 
          permissions = """
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          """
 
          required_permission = "android.permission.POST_NOTIFICATIONS"
 
          if required_permission not in s:
              match = re.search(r"<manifest\b[^>]*>", s)
 
              if not match:
                  print("ERROR: <manifest> tag not found")
                  sys.exit(1)
 
              insert_at = match.end()
 
              s = (
                  s[:insert_at]
                  + "\n"
                  + permissions
                  + s[insert_at:]
              )
 
              p.write_text(s)
 
              print("Android permissions added successfully.")
 
          else:
              print("Android permissions already exist.")
 
          final = p.read_text()
 
          required = [
              "android.permission.VIBRATE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.USE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED"
          ]
 
          missing = [
              permission
              for permission in required
              if permission not in final
          ]
 
          if missing:
              print("ERROR: Missing permissions:")
 
              for permission in missing:
                  print(" - " + permission)
 
              sys.exit(1)
 
          print("All required permissions are present.")
          PY
 
      # =========================================================
      # التحقق من أيقونة الإشعارات
      # =========================================================
      - name: Verify notification icon
        run: |
          set -e
 
          test -f "android/app/src/main/res/drawable/ic_stat_azkar.png"
 
          grep -q '"smallIcon": "ic_stat_azkar"' capacitor.config.json
 
          echo "Notification small icon verified successfully."
 
      # =========================================================
      # بناء APK
      # =========================================================
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
 
      # =========================================================
      # رفع APK كـ Artifact
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Azkar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
