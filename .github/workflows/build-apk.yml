          line_comment = False
          block_comment = False

          i = brace_start

          while i < len(source):

              c = source[i]
              n = source[i + 1] if i + 1 < len(source) else ""

              if line_comment:
                  if c == "\n":
                      line_comment = False
                  i += 1
                  continue

              if block_comment:
                  if c == "*" and n == "/":
                      block_comment = False
                      i += 2
                      continue
                  i += 1
                  continue

              if in_string:
                  if escaped:
                      escaped = False
                  elif c == "\\":
                      escaped = True
                  elif c == in_string:
                      in_string = None
                  i += 1
                  continue

              if c == "/" and n == "/":
                  line_comment = True
                  i += 2
                  continue

              if c == "/" and n == "*":
                  block_comment = True
                  i += 2
                  continue

              if c in ("'", '"', "`"):
                  in_string = c
                  i += 1
                  continue

              if c == "{":
                  depth += 1

              elif c == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

              i += 1

          if end is None:
              raise SystemExit(
                  "ERROR: Could not find end of schedulePrayerAlerts()"
              )

