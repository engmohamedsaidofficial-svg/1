name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor configuration
        run: |
          rm -f capacitor.config.ts

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.azkar.app",
            "appName": "أذكار",
            "webDir": "www",
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_azkar"
              }
            }
          }
          EOF

      - name: Add Android platform
        run: |
          if [ -d "android" ]; then
            echo "Android platform already exists."
          else
            npx cap add android
          fi

      # =========================================================
      # إصلاح جدولة تنبيهات الأذان
      # الجدولة تصبح لمدة 7 أيام بدلا من يوم واحد
      # =========================================================

      - name: Patch prayer notification scheduling
        run: |
          set -e

          python3 <<'PY'
